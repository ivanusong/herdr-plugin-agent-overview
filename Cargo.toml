[package]
name = "herdr-agent-overview"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "全 Session 的 Agent 网格总览：只读实时预览 + Enter 跳转原 pane（herdr 插件）"

[lib]
name = "herdr_agent_overview"
path = "src/lib.rs"

[[bin]]
name = "herdr-agent-overview"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
strip = true
